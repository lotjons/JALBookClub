<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – JAL Book Club</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="nav__brand">📚 JAL Book Club</a>
        <div class="nav__links">
          <a href="books.html" class="nav__link">Books</a>
          <a href="index.html" class="nav__link nav__link--active">Sign In</a>
        </div>
        <div class="nav__actions">
          <a href="register.html" class="btn btn--primary">Join the Club</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Auth card -->
      <div class="auth-card">

        <!-- Logo + heading -->
        <div class="auth-card__header">
          <span class="auth-card__logo">📚</span>
          <p class="auth-card__brand">JAL Book Club</p>
          <h1 class="auth-card__title">Welcome back, reader.</h1>
          <p class="auth-card__subtitle">The shelf has been waiting.</p>
        </div>

        <!-- Error message shown if login fails -->
        <p id="login-message" class="form-error"></p>

        <!-- Login form -->
        <form class="form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="your_username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="••••••••">
          </div>
          <button id="login-btn" type="button" class="btn btn--primary">Sign In</button>
        </form>

        <!-- Link to register -->
        <p class="auth-card__footer-text">
          Not a member yet? <a href="register.html">Join the club →</a>
        </p>

      </div>

      <!-- Footer note -->
      <p class="auth-footer">✦ Members-only access to the inner shelf</p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div>
        <p class="site-footer__brand">JAL Book Club</p>

        <p class="site-footer__meta">
          Built with books, code and questionable reading habits.
        </p>
      </div>

      <nav class="site-footer__nav" aria-label="Footer navigation">
        <a href="index.html">Books</a>
        <a href="login.html">Sign In</a>
        <a href="register.html">Join the Club</a>
      </nav>
    </div>
  </footer>

  <script src="js/functions.js"></script>
  <script src="js/login.js"></script>

</body>

</html>
